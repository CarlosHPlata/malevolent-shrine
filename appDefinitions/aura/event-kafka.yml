# Kafka broker for the events.lifecycle topic (C6, ADR-004, ADR-009).
# Event Service produces EventPublished and EventUpdated keyed by event id;
# Booking Service and Search Service consume them.
#
# Single node in KRaft mode (broker and controller in one process), so every
# replication factor is 1.
apiVersion: shrine/v1
kind: Resource
metadata:
  name: event-kafka
  owner: aura
  # Add the consumer teams (Booking Service, Search Service) here once their
  # Shrine team names exist, so their manifests may read the outputs:
  # access:
  #   - <booking-team>
  #   - <search-team>
spec:
  type: kafka
  version: "4.0.0"
  # Shrine has no default image for kafka.
  image: apache/kafka:4.0.0
  imagePullPolicy: IfNotPresent
  port: 9092
  env:
    - name: KAFKA_NODE_ID
      value: "1"
    - name: KAFKA_PROCESS_ROLES
      value: "broker,controller"
    # Fixed for this cluster: changing it makes the broker refuse its own data.
    - name: CLUSTER_ID
      value: "4PPZkfPWSlaB9n4VC0bR4g"
    - name: KAFKA_LISTENERS
      value: "PLAINTEXT://:9092,CONTROLLER://:9093"
    # Clients reach the broker at its container name (<team>.<name>) on the
    # team network and, for other teams, the platform network.
    - name: KAFKA_ADVERTISED_LISTENERS
      template: "PLAINTEXT://{{.host}}:{{.port}}"
    - name: KAFKA_CONTROLLER_LISTENER_NAMES
      value: "CONTROLLER"
    - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
      value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
    - name: KAFKA_CONTROLLER_QUORUM_VOTERS
      value: "1@localhost:9093"
    - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
      value: "1"
    - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
      value: "1"
    - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
      value: "1"
    - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
      value: "0"
    # Every topic on this broker is compacted, so events.lifecycle keeps the
    # latest message per event and a new consumer can rebuild state from it
    # (contract: topic retention). Messages must therefore carry a key.
    - name: KAFKA_LOG_CLEANUP_POLICY
      value: "compact"
    - name: KAFKA_LOG_DIRS
      value: "/var/lib/kafka/data"
  outputs:
    - name: host
    - name: port
    # Bootstrap servers for KAFKA_BROKERS.
    - name: brokers
      template: "{{.host}}:{{.port}}"
  volumes:
    - name: data
      mountPath: /var/lib/kafka/data
  networking:
    # Consumer teams connect over the shared platform network.
    exposeToPlatform: true
