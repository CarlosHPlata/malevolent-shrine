# Certificate for the tailnet host, used by the routes on the websecure
# entrypoint. Traefik reads certificates from the dynamic configuration, not
# from traefik.yml. The files live in traefik/certs/, which is not in git.
tls:
    certificates:
        - certFile: /etc/traefik/certs/gateway.tail9a6ddb.ts.net.crt
          keyFile: /etc/traefik/certs/gateway.tail9a6ddb.ts.net.key
